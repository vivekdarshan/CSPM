AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Optional role that lets Vigil apply approved security fixes. It can only
  call the specific APIs below; it cannot read data, create resources or
  change IAM users and roles. Delete this stack to turn automatic fixes off.

Parameters:
  TrustedAccountId:
    Type: String
    Description: AWS account ID that Vigil runs from (same as the read-only role).
    AllowedPattern: '^\d{12}$'
  ExternalId:
    Type: String
    Description: External ID shown in Vigil. Keep it unchanged.
    MinLength: 2
  RoleName:
    Type: String
    Default: VigilRemediation
  EnableFlowLogDelivery:
    Type: String
    Description: Also create the role VPC flow logs use to write to CloudWatch Logs.
    AllowedValues: ['true', 'false']
    Default: 'true'

Conditions:
  CreateFlowLogRole: !Equals [!Ref EnableFlowLogDelivery, 'true']

Resources:
  VigilRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Applies Vigil fixes after a person approves them
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: VigilScopedFixes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Settings
                Effect: Allow
                Action:
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutBucketLogging
                Resource: '*'
              - Sid: NetworkAndCompute
                Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:CreateFlowLogs
                Resource: '*'
              - Sid: Databases
                Effect: Allow
                Action: rds:ModifyDBInstance
                Resource: '*'
              - Sid: AccountSettings
                Effect: Allow
                Action:
                  - iam:UpdateAccountPasswordPolicy
                  - cloudtrail:UpdateTrail
                Resource: '*'
              - Sid: FlowLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:vpc-flow-logs*'
              - Sid: PassOnlyTheFlowLogRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/VigilFlowLogsDelivery'
                Condition:
                  StringEquals:
                    iam:PassedToService: vpc-flow-logs.amazonaws.com

  FlowLogsDeliveryRole:
    Type: AWS::IAM::Role
    Condition: CreateFlowLogRole
    Properties:
      RoleName: VigilFlowLogsDelivery
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:vpc-flow-logs*'

Outputs:
  RoleArn:
    Description: Paste this ARN into Vigil to turn on automatic fixes.
    Value: !GetAtt VigilRemediationRole.Arn
