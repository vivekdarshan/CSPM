AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Read-only IAM role that lets Vigil scan this account for security
  misconfigurations. The role cannot change any resources.

Parameters:
  TrustedAccountId:
    Type: String
    Description: AWS account ID that Vigil scans from (shown in the connect wizard).
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID.
  ExternalId:
    Type: String
    Description: External ID shown in the connect wizard. Keep it unchanged.
    MinLength: 2
    MaxLength: 1224
  RoleName:
    Type: String
    Description: Name of the IAM role to create.
    Default: VigilSecurityAudit

Resources:
  VigilReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only access for Vigil security posture scans
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/SecurityAudit'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess'

Outputs:
  RoleArn:
    Description: Paste this ARN into the Vigil connect wizard.
    Value: !GetAtt VigilReadOnlyRole.Arn
